<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="srT srD">
<title id="srT">System layers and legend</title>
<desc id="srD">The system layers from wire interface and query through execution, transactions and MVCC, access paths, buffer and pages, WAL and recovery, down to persistence. A legend defines the diagram primitives: data path, active signal, system state, and endpoint.</desc>
<style>
.bg{fill:#F7F8F8}
.panel{fill:#EEF1F2}
.ink{fill:#16181B}
.muted{fill:#5A616B}
.faint{fill:#8A9099}
.line{stroke:#9AA1AB}
.rule{stroke:#DCE0E4}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.blue{fill:#0A7EA4}
.green{fill:#3FAE78}
.amber{fill:#C58A32}
.violet{fill:#7567A8}
.motion{}
@media (prefers-color-scheme: dark){
.bg{fill:#0D1113}
.panel{fill:#15181B}
.ink{fill:#E7E9EB}
.muted{fill:#98A1AB}
.faint{fill:#6E747C}
.line{stroke:#3A4046}
.rule{stroke:#212629}
.blue{fill:#2E9BC0}
.green{fill:#4FBE88}
.amber{fill:#D69A42}
.violet{fill:#8B7DBE}
}
@media (prefers-reduced-motion: reduce){.motion{display:none}}
</style>
<rect width="880" height="480" class="bg"/>
<text x="48" y="44" font-size="11" letter-spacing="3.5" class="muted">SYSTEM REFERENCE</text>
<line x1="48" y1="58" x2="832" y2="58" class="rule"/>
<text x="60" y="88" font-size="10" letter-spacing="2" class="mono muted">SYSTEM LAYERS</text>
<!-- layers -->
<g class="panel">
<rect x="60" y="100" width="460" height="34"/>
<rect x="60" y="146" width="460" height="34"/>
<rect x="60" y="192" width="460" height="34"/>
<rect x="60" y="238" width="460" height="34"/>
<rect x="60" y="284" width="460" height="34"/>
<rect x="60" y="330" width="460" height="34"/>
<rect x="60" y="376" width="460" height="34"/>
<rect x="60" y="422" width="460" height="34"/>
</g>
<g fill="none" class="line">
<rect x="60" y="100" width="460" height="34"/>
<rect x="60" y="146" width="460" height="34"/>
<rect x="60" y="192" width="460" height="34"/>
<rect x="60" y="238" width="460" height="34"/>
<rect x="60" y="284" width="460" height="34"/>
<rect x="60" y="330" width="460" height="34"/>
<rect x="60" y="376" width="460" height="34"/>
<rect x="60" y="422" width="460" height="34"/>
</g>
<rect x="60" y="100" width="3" height="34" class="blue"/>
<rect x="60" y="146" width="3" height="34" class="blue"/>
<rect x="60" y="192" width="3" height="34" class="blue"/>
<rect x="60" y="238" width="3" height="34" class="violet"/>
<rect x="60" y="284" width="3" height="34" class="blue"/>
<rect x="60" y="330" width="3" height="34" class="blue"/>
<rect x="60" y="376" width="3" height="34" class="green"/>
<rect x="60" y="422" width="3" height="34" class="green"/>
<g font-size="12" font-weight="600" letter-spacing="1.4" class="ink">
<text x="76" y="122">INTERFACE</text>
<text x="76" y="168">QUERY</text>
<text x="76" y="214">EXECUTION</text>
<text x="76" y="260">TRANSACTION</text>
<text x="76" y="306">ACCESS PATHS</text>
<text x="76" y="352">STORAGE</text>
<text x="76" y="398">WAL · RECOVERY</text>
<text x="76" y="444">PERSISTENCE</text>
</g>
<g font-size="9" text-anchor="end" class="mono faint">
<text x="504" y="122">wire · clients</text>
<text x="504" y="168">parse · execute</text>
<text x="504" y="214">operators</text>
<text x="504" y="260">MVCC · snapshots</text>
<text x="504" y="306">ART · btree · brin · roaring</text>
<text x="504" y="352">buffer · page · block</text>
<text x="504" y="398">append · replay</text>
<text x="504" y="444">fsync · durable</text>
</g>
<!-- one vertical signal descends the layers once. -->
<line x1="42" y1="100" x2="42" y2="456" class="rule" stroke-dasharray="3 5"/>
<line class="motion" x1="42" y1="100" x2="42" y2="134" stroke="#0A7EA4" stroke-width="2" opacity="0">
<animate attributeName="y1" values="100;422" dur="3s" begin="0.5s" fill="freeze"/>
<animate attributeName="y2" values="134;456" dur="3s" begin="0.5s" fill="freeze"/>
<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.9;1" dur="3s" begin="0.5s" fill="freeze"/>
</line>
<!-- legend -->
<line x1="550" y1="80" x2="550" y2="440" class="rule" stroke-dasharray="3 5"/>
<text x="580" y="88" font-size="10" letter-spacing="2" class="mono muted">SYSTEM LEGEND</text>
<line x1="580" y1="116" x2="624" y2="116" class="line" stroke-width="2"/>
<text x="640" y="120" font-size="10" class="mono ink">data path</text>
<line x1="580" y1="150" x2="616" y2="150" stroke="#0A7EA4" stroke-width="2"/>
<rect x="612" y="147" width="6" height="4" rx="1" fill="#0A7EA4"/>
<text x="640" y="154" font-size="10" class="mono ink">active signal</text>
<rect x="580" y="178" width="8" height="8" class="blue"/>
<text x="640" y="186" font-size="10" class="mono ink">system state</text>
<circle cx="584" cy="216" r="4.5" fill="none" class="line" stroke-width="1.5"/>
<text x="640" y="220" font-size="10" class="mono ink">endpoint</text>
<g font-size="9" class="mono faint">
<text x="580" y="260">state colours communicate</text>
<text x="580" y="274">system condition, not brand.</text>
<text x="580" y="298">blue · active</text>
<text x="580" y="312">green · persisted</text>
<text x="580" y="326">amber · queued / transitional</text>
<text x="580" y="340">violet · metadata</text>
<text x="580" y="372">ART · in-memory radix index</text>
<text x="580" y="386">brin · columnar block range</text>
<text x="580" y="400">roaring · compressed bitmap</text>
</g>
<text x="440" y="468" text-anchor="middle" font-size="10" class="faint">one architecture — wire interface to persistence</text>
</svg>
