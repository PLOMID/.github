<svg xmlns="http://www.w3.org/2000/svg" width="880" height="220" viewBox="0 0 880 220" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" role="img" aria-labelledby="tbT tbD">
<title id="tbT">PLOMID boot sequence (illustrative)</title><desc id="tbD">Illustrative terminal animation of system initialization. See the screenshot below for real server output.</desc>
<rect width="880" height="220" rx="12" fill="#0d1117"/>
<rect width="880" height="220" rx="12" fill="none" stroke="#30363d"/>
<!-- chrome -->
<circle cx="32" cy="24" r="5" fill="#3d444d"/><circle cx="52" cy="24" r="5" fill="#3d444d"/><circle cx="72" cy="24" r="5" fill="#3d444d"/>
<text x="440" y="28" font-size="11" text-anchor="middle" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">plomid — boot</text>
<line x1="0" y1="42" x2="880" y2="42" stroke="#30363d"/>
<!-- body -->
<text x="32" y="72" font-size="13" fill="#7ee787">$ plomid</text>
<rect x="104" y="60" width="9" height="15" fill="#7ee787"/>
<g font-size="12.5" fill="#8b949e">
<text x="32" y="100">initializing storage ............<tspan fill="#7ee787"> ok</tspan></text>
<text x="32" y="124">loading catalog ..............<tspan fill="#7ee787"> ok</tspan></text>
<text x="32" y="148">listening on 127.0.0.1:5432 ...<tspan fill="#7ee787"> ok</tspan></text>
<text x="32" y="176" fill="#7ee787">PLOMID ready</text>
</g>
<text x="32" y="200" font-size="13" fill="#3d444d">illustrative — real output below</text>
</svg>
