<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="sgT sgD">
<title id="sgT">PLOMID system signature</title>
<desc id="sgD">A closing system signature: data models, access structures, durability structures, and implementation notes. One brief blue signal passes along the title rule, then the signature is static.</desc>
<style>
.bg{fill:#F7F8F8}
.ink{fill:#16181B}
.muted{fill:#5A616B}
.faint{fill:#8A9099}
.rule{stroke:#DCE0E4}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.blue{fill:#0A7EA4}
.green{fill:#3FAE78}
.violet{fill:#7567A8}
.motion{}
@media (prefers-color-scheme: dark){
.bg{fill:#0D1113}
.ink{fill:#E7E9EB}
.muted{fill:#98A1AB}
.faint{fill:#6E747C}
.rule{stroke:#212629}
.blue{fill:#2E9BC0}
.green{fill:#4FBE88}
.violet{fill:#8B7DBE}
}
@media (prefers-reduced-motion: reduce){.motion{display:none}}
</style>
<rect width="880" height="380" class="bg"/>
<text x="440" y="64" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="4" class="ink">PLOMID / DATA INFRASTRUCTURE</text>
<line x1="200" y1="80" x2="680" y2="80" class="rule"/>
<rect x="186" y="123" width="7" height="7" class="faint"/>
<text x="210" y="112" font-size="8.5" letter-spacing="3" class="mono muted">MODELS</text>
<text x="210" y="134" font-size="12.5" font-weight="600" letter-spacing="1.5" class="ink">SQL · JSON · TIME SERIES · VECTOR · GRAPH</text>
<rect x="186" y="187" width="7" height="7" class="blue"/>
<text x="210" y="176" font-size="8.5" letter-spacing="3" class="mono muted">ACCESS</text>
<text x="210" y="198" font-size="12.5" font-weight="600" letter-spacing="1.5" class="ink">ART · B+TREE · BRIN · ZONEMAP · ROARING</text>
<rect x="186" y="251" width="7" height="7" class="green"/>
<text x="210" y="240" font-size="8.5" letter-spacing="3" class="mono muted">DURABILITY</text>
<text x="210" y="262" font-size="12.5" font-weight="600" letter-spacing="1.5" class="ink">MVCC · WAL · BUFFER · PAGE · BLOCK</text>
<rect x="186" y="315" width="7" height="7" class="violet"/>
<text x="210" y="304" font-size="8.5" letter-spacing="3" class="mono muted">IMPLEMENTATION</text>
<text x="210" y="326" font-size="12.5" font-weight="600" letter-spacing="1.5" class="ink">RUST · UNSAFE FORBIDDEN · POSTGRESQL WIRE</text>
<!-- one brief blue signal passes along the title rule, then the signature is static. -->
<line class="motion" x1="200" y1="80" x2="200" y2="80" stroke="#0A7EA4" stroke-width="2" opacity="0">
<animate attributeName="x2" values="200;680" dur="1.2s" begin="0.5s" fill="freeze"/>
<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="1.6s" begin="0.5s" fill="freeze"/>
</line>
<text x="440" y="360" text-anchor="middle" font-size="10" letter-spacing="2" class="faint">UNIFIED DATA INFRASTRUCTURE</text>
</svg>
