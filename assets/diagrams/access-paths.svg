<svg xmlns="http://www.w3.org/2000/svg" width="880" height="392" viewBox="0 0 880 392" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="apT apD">
<title id="apT">Access paths</title>
<desc id="apD">A query is served by distinct access structures over one stored-data foundation: an adaptive radix tree for point equality, a persistent B+tree for ordered ranges, a Roaring bitmap for candidate sets, an XOR membership prefilter, and BRIN with zone maps for columnar pruning. One brief accent signal enters the branch bus, then the diagram is static.</desc>
<style>
.bg{fill:#F7F8F8}
.panel{fill:#EEF1F2}
.ink{fill:#16181B}
.muted{fill:#5A616B}
.faint{fill:#8A9099}
.line{stroke:#9AA1AB}
.rule{stroke:#DCE0E4}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.blue{fill:#0A7EA4}
.violet{fill:#7567A8}
.amber{fill:#C58A32}
.green{fill:#3FAE78}
.motion{}
@media (prefers-color-scheme: dark){
.bg{fill:#0D1113}
.panel{fill:#15181B}
.ink{fill:#E7E9EB}
.muted{fill:#98A1AB}
.faint{fill:#6E747C}
.line{stroke:#3A4046}
.rule{stroke:#212629}
.blue{fill:#2E9BC0}
.violet{fill:#8B7DBE}
.amber{fill:#D69A42}
.green{fill:#4FBE88}
}
@media (prefers-reduced-motion: reduce){.motion{display:none}}
</style>
<rect width="880" height="392" class="bg"/>
<text x="48" y="44" font-size="11" letter-spacing="3.5" class="muted">ACCESS PATHS</text>
<text x="832" y="44" font-size="9.5" text-anchor="end" class="mono faint">point · range · filter · membership · prune</text>
<line x1="48" y1="58" x2="832" y2="58" class="rule"/>
<!-- query -->
<rect x="360" y="76" width="160" height="38" rx="3" class="panel"/>
<rect x="360" y="76" width="160" height="38" rx="3" fill="none" class="line"/>
<text x="440" y="100" font-size="12" font-weight="600" letter-spacing="1.5" text-anchor="middle" class="ink">QUERY ACCESS</text>
<!-- branch bus -->
<g fill="none" class="line" stroke-width="1.5">
<line x1="440" y1="114" x2="440" y2="146"/>
<line x1="121" y1="146" x2="761" y2="146"/>
<line x1="121" y1="146" x2="121" y2="176"/>
<line x1="281" y1="146" x2="281" y2="176"/>
<line x1="441" y1="146" x2="441" y2="176"/>
<line x1="601" y1="146" x2="601" y2="176"/>
<line x1="761" y1="146" x2="761" y2="176"/>
</g>
<!-- access structures -->
<g class="panel">
<rect x="48" y="176" width="146" height="64" rx="3"/>
<rect x="208" y="176" width="146" height="64" rx="3"/>
<rect x="368" y="176" width="146" height="64" rx="3"/>
<rect x="528" y="176" width="146" height="64" rx="3"/>
<rect x="688" y="176" width="146" height="64" rx="3"/>
</g>
<g fill="none" class="line">
<rect x="48" y="176" width="146" height="64" rx="3"/>
<rect x="208" y="176" width="146" height="64" rx="3"/>
<rect x="368" y="176" width="146" height="64" rx="3"/>
<rect x="528" y="176" width="146" height="64" rx="3"/>
<rect x="688" y="176" width="146" height="64" rx="3"/>
</g>
<rect x="48" y="176" width="3" height="64" class="blue"/>
<rect x="208" y="176" width="3" height="64" class="blue"/>
<rect x="368" y="176" width="3" height="64" class="violet"/>
<rect x="528" y="176" width="3" height="64" class="violet"/>
<rect x="688" y="176" width="3" height="64" class="amber"/>
<g font-size="8.5" letter-spacing="1.6" text-anchor="middle" class="mono muted">
<text x="121" y="196">POINT</text>
<text x="281" y="196">ORDERED RANGE</text>
<text x="441" y="196">SET FILTER</text>
<text x="601" y="196">MEMBERSHIP</text>
<text x="761" y="196">PRUNE</text>
</g>
<g font-size="12" font-weight="600" letter-spacing="1.2" text-anchor="middle" class="ink">
<text x="121" y="217">ART</text>
<text x="281" y="217">B+TREE</text>
<text x="441" y="217">ROARING</text>
<text x="601" y="217">XOR</text>
<text x="761" y="217">BRIN · ZONEMAP</text>
</g>
<g font-size="8.5" text-anchor="middle" class="mono faint">
<text x="121" y="233">derived runtime index</text>
<text x="281" y="233">persistent index</text>
<text x="441" y="233">compressed bitmap</text>
<text x="601" y="233">approximate prefilter</text>
<text x="761" y="233">block · region skip</text>
</g>
<!-- converge -->
<g fill="none" class="line" stroke-width="1.5">
<line x1="121" y1="240" x2="121" y2="268"/>
<line x1="281" y1="240" x2="281" y2="268"/>
<line x1="441" y1="240" x2="441" y2="268"/>
<line x1="601" y1="240" x2="601" y2="268"/>
<line x1="761" y1="240" x2="761" y2="268"/>
<line x1="121" y1="268" x2="761" y2="268"/>
<line x1="440" y1="268" x2="440" y2="288"/>
</g>
<!-- shared data -->
<rect x="48" y="288" width="784" height="42" rx="3" class="panel"/>
<rect x="48" y="288" width="784" height="42" rx="3" fill="none" class="line"/>
<rect x="48" y="288" width="3" height="42" class="green"/>
<text x="440" y="314" font-size="12.5" font-weight="600" letter-spacing="2" text-anchor="middle" class="ink">SHARED STORED DATA</text>
<text x="820" y="314" font-size="8.5" text-anchor="end" class="mono faint">16 KiB pages · B+tree · columnar</text>
<!-- one brief accent signal enters the branch bus, then the diagram is static. -->
<line class="motion" x1="440" y1="116" x2="440" y2="116" stroke="#0A7EA4" stroke-width="2" opacity="0">
<animate attributeName="y2" values="116;144" dur="0.5s" begin="0.5s" fill="freeze"/>
<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.3;0.72;1" dur="1s" begin="0.5s" fill="freeze"/>
</line>
<text x="440" y="356" text-anchor="middle" font-size="10" class="faint">separate access structures over one stored-data foundation</text>
<text x="440" y="374" text-anchor="middle" font-size="9" class="mono faint">ART derived at runtime from the persistent B+tree payload</text>
</svg>
