<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="txT txD">
<title id="txT">Transaction lifecycle and MVCC versions</title>
<desc id="txD">A transaction moves from active to committed or aborted; committed data becomes durable. The MVCC row-version chain resolves by snapshot visibility. One signal follows the commit transition.</desc>
<style>
.bg{fill:#F7F8F8}
.panel{fill:#EEF1F2}
.ink{fill:#16181B}
.muted{fill:#5A616B}
.faint{fill:#8A9099}
.line{stroke:#9AA1AB}
.rule{stroke:#DCE0E4}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.blue{fill:#0A7EA4}
.green{fill:#3FAE78}
.amber{fill:#C58A32}
.red{fill:#B85C5C}
.motion{}
@media (prefers-color-scheme: dark){
.bg{fill:#0D1113}
.panel{fill:#15181B}
.ink{fill:#E7E9EB}
.muted{fill:#98A1AB}
.faint{fill:#6E747C}
.line{stroke:#3A4046}
.rule{stroke:#212629}
.blue{fill:#2E9BC0}
.green{fill:#4FBE88}
.amber{fill:#D69A42}
.red{fill:#C96C6C}
}
@media (prefers-reduced-motion: reduce){.motion{display:none}}
</style>
<rect width="880" height="440" class="bg"/>
<text x="48" y="44" font-size="11" letter-spacing="3.5" class="muted">TRANSACTION · MVCC</text>
<line x1="48" y1="58" x2="832" y2="58" class="rule"/>
<line x1="450" y1="80" x2="450" y2="340" class="rule" stroke-dasharray="3 5"/>
<!-- state machine -->
<text x="60" y="88" font-size="10" letter-spacing="2" class="mono muted">TRANSACTION STATE</text>
<rect x="150" y="108" width="170" height="46" rx="3" fill="none" class="blue" stroke-width="1.5"/>
<text x="235" y="137" font-size="13" font-weight="600" letter-spacing="1.5" text-anchor="middle" class="ink">ACTIVE</text>
<g fill="none" class="line" stroke-width="1.5">
<line x1="235" y1="154" x2="235" y2="186"/>
<line x1="160" y1="186" x2="310" y2="186"/>
<line x1="160" y1="186" x2="160" y2="214"/>
<line x1="310" y1="186" x2="310" y2="214"/>
</g>
<g font-size="9" class="mono muted">
<text x="196" y="181">commit</text>
<text x="266" y="181">abort</text>
</g>
<rect x="85" y="214" width="150" height="46" rx="3" fill="none" class="green" stroke-width="1.5"/>
<text x="160" y="243" font-size="12" font-weight="600" letter-spacing="1.2" text-anchor="middle" class="ink">COMMITTED</text>
<rect x="235" y="214" width="150" height="46" rx="3" fill="none" class="red" stroke-width="1.5"/>
<text x="310" y="243" font-size="12" font-weight="600" letter-spacing="1.2" text-anchor="middle" class="ink">ABORTED</text>
<line x1="160" y1="260" x2="160" y2="292" class="rule"/>
<text x="160" y="312" font-size="9" text-anchor="middle" class="mono muted">durable state</text>
<text x="160" y="326" font-size="9" text-anchor="middle" class="mono faint">WAL · storage</text>
<!-- one signal follows the commit transition, once. -->
<rect class="motion" x="-3" y="-2" width="6" height="4" rx="1" fill="#0A7EA4" opacity="0">
<animateMotion dur="1.6s" begin="0.6s" fill="freeze" path="M235 156 L235 186 L160 186 L160 212"/>
<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="1.6s" begin="0.6s" fill="freeze"/>
</rect>
<!-- MVCC version chain (newest first) -->
<text x="470" y="88" font-size="10" letter-spacing="2" class="mono muted">MVCC VERSION CHAIN</text>
<g>
<rect x="470" y="104" width="362" height="34" class="panel"/>
<rect x="470" y="104" width="3" height="34" class="amber"/>
<text x="486" y="126" font-size="10" class="mono ink">v3 · uncommitted</text>
<text x="820" y="126" font-size="9" text-anchor="end" class="mono amber">transaction-local</text>
</g>
<g>
<rect x="470" y="150" width="362" height="34" class="panel"/>
<rect x="470" y="150" width="3" height="34" class="blue"/>
<text x="486" y="172" font-size="10" class="mono ink">v2 · live</text>
<text x="820" y="172" font-size="9" text-anchor="end" class="mono blue">visible per snapshot</text>
</g>
<g>
<rect x="470" y="196" width="362" height="34" class="panel"/>
<rect x="470" y="196" width="3" height="34" class="red"/>
<text x="486" y="218" font-size="10" class="mono ink">v1 · deleted</text>
<text x="820" y="218" font-size="9" text-anchor="end" class="mono faint">delete tombstone</text>
</g>
<text x="470" y="252" font-size="9" class="mono faint">newest first — one chain per row, resolved per snapshot</text>
<text x="470" y="266" font-size="9" class="mono faint">Live · Deleted · Uncommitted · Invisible</text>
<text x="440" y="410" text-anchor="middle" font-size="10" class="faint">transaction lifecycle — one active transition, resolved by snapshot visibility</text>
</svg>
