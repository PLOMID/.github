<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="ssT ssD">
<title id="ssT">Storage cross-section</title><desc id="ssD">Layered storage cross-section from query interface down to physical data, with a write signal descending and an acknowledgement returning.</desc>
<style>
.bg{fill:#F7F8F8}.ink{fill:#1a1a1a}.muted{fill:#5c5c5c}.faint{fill:#8a8a8a}.rule{stroke:#d9d9d9}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.motion{}
@media (prefers-color-scheme: dark){.bg{fill:#0D1113}.ink{fill:#e9e9e9}.muted{fill:#9a9a9a}.faint{fill:#6e6e6e}.rule{stroke:#26292c}}
@media (prefers-reduced-motion: reduce){.motion{display:none}}
</style>
<rect width="880" height="430" class="bg"/>
<text x="48" y="42" font-size="11" letter-spacing="3" class="muted">STORAGE CROSS-SECTION</text>
<line x1="48" y1="56" x2="832" y2="56" class="rule"/>
<!-- strata: full-width bands, decreasing indent = depth -->
<g>
<line x1="120" y1="92" x2="760" y2="92" class="rule" stroke-width="3"/>
<text x="120" y="116" font-size="14" class="ink">Query / Execution</text><text x="760" y="116" font-size="10" text-anchor="end" class="faint">SQL · optimizer · executor</text>
<line x1="140" y1="140" x2="740" y2="140" class="rule" stroke-width="5"/>
<text x="140" y="164" font-size="14" class="ink">Transactions / Data Management</text><text x="740" y="164" font-size="10" text-anchor="end" class="faint">MVCC · lifecycle</text>
<line x1="160" y1="188" x2="720" y2="188" class="rule" stroke-width="7"/>
<text x="160" y="212" font-size="14" class="ink">Indexing</text><text x="720" y="212" font-size="10" text-anchor="end" class="faint">B+tree · filters · pruning</text>
<line x1="180" y1="236" x2="700" y2="236" class="rule" stroke-width="9"/>
<text x="180" y="260" font-size="14" class="ink">Storage Engine</text><text x="700" y="260" font-size="10" text-anchor="end" class="faint">pages · columnar</text>
<line x1="200" y1="284" x2="680" y2="284" class="rule" stroke-width="11"/>
<text x="200" y="308" font-size="14" class="ink">Durability</text><text x="680" y="308" font-size="10" text-anchor="end" class="faint">WAL · checksums</text>
<line x1="220" y1="332" x2="660" y2="332" class="rule" stroke-width="13"/>
<text x="220" y="356" font-size="14" class="ink">Physical Data</text><text x="660" y="356" font-size="10" text-anchor="end" class="faint">segments · files</text>
</g>
<!-- write signal descends left channel -->
<line x1="84" y1="92" x2="84" y2="332" class="rule" stroke-dasharray="3 5"/>
<g fill="#0A7EA4"><circle class="motion" r="5" cx="84" cy="92"><animate attributeName="cy" values="92;332" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3s" repeatCount="indefinite"/></circle></g>
<text x="60" y="384" font-size="10" text-anchor="middle" class="faint mono">write</text>
<!-- ack returns right channel -->
<line x1="796" y1="332" x2="796" y2="92" class="rule" stroke-dasharray="3 5"/>
<g fill="none" stroke="#0A7EA4" stroke-width="2"><circle class="motion" r="4" cx="796" cy="332" fill="none"><animate attributeName="cy" values="332;92" dur="3s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3s" begin="1.5s" repeatCount="indefinite"/></circle></g>
<text x="796" y="384" font-size="10" text-anchor="middle" class="faint mono">ack</text>
<text x="440" y="410" text-anchor="middle" font-size="10" class="faint">depth increases downward — query at surface, physical data at base</text>
</svg>
