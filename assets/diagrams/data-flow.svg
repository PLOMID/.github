<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="dfT dfD">
<title id="dfT">From access to storage</title>
<desc id="dfD">A request travels from data access through the PLOMID core to the storage foundation.</desc>
<style>
.bg{fill:#F7F8F8}
.ink{fill:#16181B}
.muted{fill:#5A616B}
.line{stroke:#9AA1AB}
.rule{stroke:#DCE0E4}
.logo{fill:#14161A}
.motion{}
@media (prefers-color-scheme: dark){
.bg{fill:#0D1113}
.ink{fill:#E7E9EB}
.muted{fill:#98A1AB}
.line{stroke:#3A4046}
.rule{stroke:#212629}
.logo{fill:#F2F3F4}
}
@media (prefers-reduced-motion: reduce){.motion{display:none}}
</style>
<rect width="880" height="300" class="bg"/>
<text x="48" y="44" font-size="11" letter-spacing="3.5" class="muted">REQUEST PATH</text>
<line x1="48" y1="58" x2="832" y2="58" class="rule"/>
<!-- pipeline -->
<line x1="120" y1="170" x2="760" y2="170" class="line" stroke-width="1.5"/>
<g class="line" stroke-width="2">
<line x1="120" y1="156" x2="120" y2="184"/>
<line x1="760" y1="156" x2="760" y2="184"/>
</g>
<g font-size="13" font-weight="600" letter-spacing="2" text-anchor="middle" class="ink">
<text x="120" y="132">DATA ACCESS</text>
<text x="760" y="132">STORAGE FOUNDATION</text>
</g>
<!-- PLOMID core -->
<g transform="translate(411.8,124) scale(0.0343)"><g class="logo" fill-rule="evenodd">
<path d="M 202 1608 L 216 1610 L 244 1609 L 244 1531 L 246 1529 L 380 1529 L 402 1527 L 437 1495 L 437 1418 L 401 1386 L 203 1386 L 203 1429 L 387 1429 L 395 1436 L 395 1476 L 385 1486 L 230 1487 L 202 1508 Z"/>
<path d="M 515 1386 L 514 1609 L 721 1609 L 721 1568 L 556 1567 L 555 1387 Z"/>
<path d="M 1023 269 L 693 465 L 621 510 L 621 1055 L 817 1175 L 817 627 L 1009 514 L 1019 510 L 1210 629 L 1210 713 L 1008 835 L 1008 1061 L 1260 916 L 1409 827 L 1409 509 Z"/>
<path d="M 841 1386 L 780 1449 L 781 1549 L 841 1609 L 992 1610 L 1054 1548 L 1053 1447 L 992 1386 Z M 822 1465 L 857 1429 L 978 1429 L 1012 1465 L 1012 1532 L 977 1568 L 857 1568 L 822 1532 Z"/>
<path d="M 1127 1387 L 1127 1610 L 1169 1608 L 1170 1459 L 1264 1539 L 1356 1458 L 1358 1460 L 1358 1609 L 1399 1609 L 1400 1391 L 1398 1386 L 1366 1386 L 1264 1480 L 1161 1386 Z"/>
<path d="M 1478 1386 L 1476 1388 L 1476 1608 L 1485 1610 L 1518 1609 L 1518 1387 Z"/>
<path d="M 1597 1387 L 1598 1429 L 1781 1429 L 1802 1451 L 1802 1545 L 1780 1568 L 1641 1568 L 1639 1566 L 1639 1462 L 1597 1462 L 1598 1609 L 1797 1609 L 1844 1562 L 1845 1436 L 1797 1386 Z"/>
</g></g>
<!-- the mark activates as the request signal reaches it: a soft accent band sweeps left → right, timed to the hold window of the existing pipeline signal. A static, logo-shaped mask confines the accent to the official logo geometry. -->
<defs>
<linearGradient id="flowBand" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#0A7EA4" stop-opacity="0"/>
<stop offset="0.35" stop-color="#0A7EA4" stop-opacity="0.35"/>
<stop offset="0.75" stop-color="#0A7EA4" stop-opacity="0.95"/>
<stop offset="0.9" stop-color="#0A7EA4" stop-opacity="0.95"/>
<stop offset="1" stop-color="#0A7EA4" stop-opacity="0"/>
</linearGradient>
<mask id="flowLogoMask" maskUnits="userSpaceOnUse" x="404" y="126" width="100" height="72">
<g transform="translate(411.8,124) scale(0.0343)"><g fill="#FFFFFF" fill-rule="evenodd">
<path d="M 202 1608 L 216 1610 L 244 1609 L 244 1531 L 246 1529 L 380 1529 L 402 1527 L 437 1495 L 437 1418 L 401 1386 L 203 1386 L 203 1429 L 387 1429 L 395 1436 L 395 1476 L 385 1486 L 230 1487 L 202 1508 Z"/>
<path d="M 515 1386 L 514 1609 L 721 1609 L 721 1568 L 556 1567 L 555 1387 Z"/>
<path d="M 1023 269 L 693 465 L 621 510 L 621 1055 L 817 1175 L 817 627 L 1009 514 L 1019 510 L 1210 629 L 1210 713 L 1008 835 L 1008 1061 L 1260 916 L 1409 827 L 1409 509 Z"/>
<path d="M 841 1386 L 780 1449 L 781 1549 L 841 1609 L 992 1610 L 1054 1548 L 1053 1447 L 992 1386 Z M 822 1465 L 857 1429 L 978 1429 L 1012 1465 L 1012 1532 L 977 1568 L 857 1568 L 822 1532 Z"/>
<path d="M 1127 1387 L 1127 1610 L 1169 1608 L 1170 1459 L 1264 1539 L 1356 1458 L 1358 1460 L 1358 1609 L 1399 1609 L 1400 1391 L 1398 1386 L 1366 1386 L 1264 1480 L 1161 1386 Z"/>
<path d="M 1478 1386 L 1476 1388 L 1476 1608 L 1485 1610 L 1518 1609 L 1518 1387 Z"/>
<path d="M 1597 1387 L 1598 1429 L 1781 1429 L 1802 1451 L 1802 1545 L 1780 1568 L 1641 1568 L 1639 1566 L 1639 1462 L 1597 1462 L 1598 1609 L 1797 1609 L 1844 1562 L 1845 1436 L 1797 1386 Z"/>
</g></g>
</mask>
</defs>
<g class="motion">
<rect x="404" y="126" width="14" height="62" fill="url(#flowBand)" mask="url(#flowLogoMask)" opacity="0">
<animate attributeName="x" values="404;404;484;484" keyTimes="0;0.35;0.60;1" dur="8s" begin="0.6s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.37;0.58;0.66;1" dur="8s" begin="0.6s" repeatCount="indefinite"/>
</rect>
</g>
<g font-size="10" text-anchor="middle" class="muted">
<text x="120" y="206">queries · requests</text>
<text x="440" y="206">processing</text>
<text x="760" y="206">durable state</text>
</g>
<!-- one signal: short accent segment traveling the pipeline -->
<line class="motion" x1="120" y1="170" x2="190" y2="170" stroke="#0A7EA4" stroke-width="2" opacity="0">
<animate attributeName="x1" values="120;405;405;690" keyTimes="0;0.35;0.65;1" dur="8s" begin="0.6s" repeatCount="indefinite"/>
<animate attributeName="x2" values="190;475;475;760" keyTimes="0;0.35;0.65;1" dur="8s" begin="0.6s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="1;1;0" keyTimes="0;0.9;1" dur="8s" begin="0.6s" repeatCount="indefinite"/>
</line>
<text x="440" y="264" text-anchor="middle" font-size="11" letter-spacing="3" class="muted">REQUEST → PROCESSING → PERSISTENCE</text>
</svg>