<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="arT arD">
<title id="arT">PLOMID architecture</title>
<desc id="arD">Applications access PLOMID through a data-access layer; the core manages data and transactions above a storage foundation that persists to physical data.</desc>
<style>
.bg{fill:#F7F8F8}
.ink{fill:#16181B}
.muted{fill:#5A616B}
.line{stroke:#9AA1AB}
.rule{stroke:#DCE0E4}
.logo{fill:#14161A}
@media (prefers-color-scheme: dark){
.bg{fill:#0D1113}
.ink{fill:#E7E9EB}
.muted{fill:#98A1AB}
.line{stroke:#3A4046}
.rule{stroke:#212629}
.logo{fill:#F2F3F4}
}
</style>
<rect width="880" height="400" class="bg"/>
<text x="48" y="44" font-size="11" letter-spacing="3.5" class="muted">ARCHITECTURE</text>
<line x1="48" y1="58" x2="832" y2="58" class="rule"/>
<!-- layer chain -->
<g font-size="14" font-weight="600" letter-spacing="2" text-anchor="middle" class="ink">
<text x="440" y="104">APPLICATIONS</text>
<text x="440" y="150">DATA ACCESS</text>
<text x="440" y="258">DATA MANAGEMENT</text>
<text x="440" y="304">STORAGE FOUNDATION</text>
<text x="440" y="350">PHYSICAL DATA</text>
</g>
<g font-size="10" text-anchor="middle" class="muted">
<text x="440" y="122">clients · drivers · psql</text>
<text x="440" y="168">SQL · PostgreSQL wire protocol</text>
<text x="440" y="276">catalog · MVCC · transactions</text>
<text x="440" y="322">pages · buffer pool · WAL · checksums</text>
<text x="440" y="368">devices · data files</text>
</g>
