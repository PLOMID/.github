<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="qxT qxD">
<title id="qxT">Query execution</title>
<desc id="qxD">A statement moves from SQL text through parse to execution, where the executor runs operators over the storage engine: scan, filter, join, aggregate, sort, distinct, projection, and DML or DDL. Reads and writes share the same path, with writes staging index maintenance. There is no separate planning stage.</desc>
<style>
.bg{fill:#F7F8F8}
.panel{fill:#EEF1F2}
.ink{fill:#16181B}
.muted{fill:#5A616B}
.faint{fill:#8A9099}
.line{stroke:#9AA1AB}
.rule{stroke:#DCE0E4}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.blue{fill:#0A7EA4}
.amber{fill:#C58A32}
.motion{}
@media (prefers-color-scheme: dark){
.bg{fill:#0D1113}
.panel{fill:#15181B}
.ink{fill:#E7E9EB}
.muted{fill:#98A1AB}
.faint{fill:#6E747C}
.line{stroke:#3A4046}
.rule{stroke:#212629}
.blue{fill:#2E9BC0}
.amber{fill:#D69A42}
}
@media (prefers-reduced-motion: reduce){.motion{display:none}}
</style>
<rect width="880" height="360" class="bg"/>
<text x="48" y="44" font-size="11" letter-spacing="3.5" class="muted">QUERY EXECUTION</text>
<text x="832" y="44" font-size="10" text-anchor="end" class="mono faint">parse → execute</text>
<line x1="48" y1="58" x2="832" y2="58" class="rule"/>
<!-- pipeline -->
<g class="line" stroke-width="1.5">
<line x1="218" y1="126" x2="252" y2="126"/>
<line x1="422" y1="126" x2="456" y2="126"/>
<line x1="626" y1="126" x2="660" y2="126"/>
<line x1="541" y1="148" x2="541" y2="182"/>
</g>
<g class="panel">
<rect x="48" y="104" width="170" height="44" rx="3"/>
<rect x="252" y="104" width="170" height="44" rx="3"/>
<rect x="456" y="104" width="170" height="44" rx="3"/>
<rect x="660" y="104" width="170" height="44" rx="3"/>
</g>
<g fill="none" class="line">
<rect x="48" y="104" width="170" height="44" rx="3"/>
<rect x="252" y="104" width="170" height="44" rx="3"/>
<rect x="456" y="104" width="170" height="44" rx="3"/>
<rect x="660" y="104" width="170" height="44" rx="3"/>
</g>
<rect x="48" y="104" width="3" height="44" class="blue"/>
<rect x="252" y="104" width="3" height="44" class="blue"/>
<rect x="456" y="104" width="3" height="44" class="blue"/>
<rect x="660" y="104" width="3" height="44" class="blue"/>
<g font-size="12" font-weight="600" letter-spacing="1.5" text-anchor="middle" class="ink">
<text x="133" y="124">SQL</text>
<text x="337" y="124">PARSE</text>
<text x="541" y="124">EXECUTE</text>
<text x="745" y="124">RESULT</text>
</g>
<g font-size="9" text-anchor="middle" class="mono faint">
<text x="133" y="139">statement</text>
<text x="337" y="139">AST</text>
<text x="541" y="139">operators</text>
<text x="745" y="139">rows</text>
</g>
<!-- operators -->
<rect x="48" y="182" width="784" height="116" rx="3" class="panel"/>
<rect x="48" y="182" width="784" height="116" rx="3" fill="none" class="line"/>
<text x="62" y="202" font-size="9" letter-spacing="2" class="mono muted">OPERATORS</text>
<g class="panel">
<rect x="48" y="212" width="184" height="32" rx="2" fill="none" class="line"/>
<rect x="248" y="212" width="184" height="32" rx="2" fill="none" class="line"/>
<rect x="448" y="212" width="184" height="32" rx="2" fill="none" class="line"/>
<rect x="648" y="212" width="184" height="32" rx="2" fill="none" class="line"/>
<rect x="48" y="252" width="184" height="32" rx="2" fill="none" class="line"/>
<rect x="248" y="252" width="184" height="32" rx="2" fill="none" class="line"/>
<rect x="448" y="252" width="184" height="32" rx="2" fill="none" class="line"/>
<rect x="648" y="252" width="184" height="32" rx="2" fill="none" class="line"/>
</g>
<g font-size="10.5" letter-spacing="1.5" text-anchor="middle" class="mono ink">
<text x="140" y="232">SCAN</text>
<text x="340" y="232">FILTER</text>
<text x="540" y="232">JOIN</text>
<text x="740" y="232">AGGREGATE</text>
<text x="140" y="272">SORT</text>
<text x="340" y="272">DISTINCT</text>
<text x="540" y="272">PROJECTION</text>
<text x="740" y="272">DML · DDL</text>
</g>
<rect x="48" y="212" width="3" height="32" class="blue"/>
<rect x="248" y="212" width="3" height="32" class="blue"/>
<rect x="448" y="212" width="3" height="32" class="blue"/>
<rect x="648" y="212" width="3" height="32" class="blue"/>
<rect x="48" y="252" width="3" height="32" class="blue"/>
<rect x="248" y="252" width="3" height="32" class="blue"/>
<rect x="448" y="252" width="3" height="32" class="blue"/>
<rect x="648" y="252" width="3" height="32" class="amber"/>
<text x="440" y="322" text-anchor="middle" font-size="10" class="faint">statements execute directly over the storage engine — no separate planning stage</text>
<text x="440" y="340" text-anchor="middle" font-size="9" class="mono faint">writes stage index maintenance through the same engine</text>
</svg>
