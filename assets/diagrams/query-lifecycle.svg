<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="qlT qlD">
<title id="qlT">Query lifecycle</title>
<desc id="qlD">A request moves through query, parse, plan, execute, access, and persist — the lifecycle of a request against the shared storage foundation, shown as a numbered trace. One signal travels the lifecycle once.</desc>
<style>
.bg{fill:#F7F8F8}
.ink{fill:#16181B}
.muted{fill:#5A616B}
.faint{fill:#8A9099}
.line{stroke:#9AA1AB}
.rule{stroke:#DCE0E4}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.motion{}
@media (prefers-color-scheme: dark){
.bg{fill:#0D1113}
.ink{fill:#E7E9EB}
.muted{fill:#98A1AB}
.faint{fill:#6E747C}
.line{stroke:#3A4046}
.rule{stroke:#212629}
}
@media (prefers-reduced-motion: reduce){.motion{display:none}}
</style>
<rect width="880" height="420" class="bg"/>
<text x="48" y="44" font-size="11" letter-spacing="3.5" class="muted">QUERY LIFECYCLE</text>
<text x="832" y="44" font-size="10" text-anchor="end" class="mono faint">execution trace</text>
<line x1="48" y1="58" x2="832" y2="58" class="rule"/>
<text x="236" y="92" font-size="8.5" letter-spacing="2" class="mono faint">STAGE</text>
<text x="278" y="92" font-size="8.5" letter-spacing="2" class="mono faint">STEP</text>
<!-- spine -->
<line x1="200" y1="100" x2="200" y2="392" class="rule" stroke-dasharray="3 5"/>
<!-- one signal: a short accent segment travels the lifecycle once, then the diagram is static. -->
<line class="motion" x1="200" y1="100" x2="200" y2="130" stroke="#0A7EA4" stroke-width="2" opacity="0">
<animate attributeName="y1" values="100;362" dur="4s" begin="0.4s" fill="freeze"/>
<animate attributeName="y2" values="130;392" dur="4s" begin="0.4s" fill="freeze"/>
<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.9;1" dur="4s" begin="0.4s" fill="freeze"/>
</line>
<!-- stages -->
<g class="line" stroke-width="1.5">
<line x1="200" y1="120" x2="216" y2="120"/>
<line x1="200" y1="172" x2="216" y2="172"/>
<line x1="200" y1="224" x2="216" y2="224"/>
<line x1="200" y1="276" x2="216" y2="276"/>
<line x1="200" y1="328" x2="216" y2="328"/>
<line x1="200" y1="380" x2="216" y2="380"/>
</g>
<g font-size="9" class="mono faint">
<text x="236" y="125">01</text>
<text x="236" y="177">02</text>
<text x="236" y="229">03</text>
<text x="236" y="281">04</text>
<text x="236" y="333">05</text>
<text x="236" y="385">06</text>
</g>
<g font-size="13" font-weight="600" letter-spacing="2" class="mono ink">
<text x="278" y="125">QUERY</text>
<text x="278" y="177">PARSE</text>
<text x="278" y="229">PLAN</text>
<text x="278" y="281">EXECUTE</text>
<text x="278" y="333">ACCESS</text>
<text x="278" y="385">PERSIST</text>
</g>
<g font-size="10.5" text-anchor="end" class="muted">
<text x="832" y="125">request arrives</text>
<text x="832" y="177">statement → tree</text>
<text x="832" y="229">logical → physical</text>
<text x="832" y="281">operators run</text>
<text x="832" y="333">point · range · set</text>
<text x="832" y="385">durable state</text>
</g>
<text x="440" y="410" text-anchor="middle" font-size="10" class="faint">illustrative stage order — not timings</text>
</svg>
